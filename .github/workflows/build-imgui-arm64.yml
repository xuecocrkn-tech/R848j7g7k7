name: Build imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            ant \
            make \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file \
            binutils

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone exact imgui-java commit
        shell: bash
        run: |
          set -e

          git clone https://github.com/Moulberry/imgui-java.git imgui-java

          cd imgui-java

          git fetch --all --tags --prune

          SHA=$(git rev-list --all | grep '^aacdae671a' | head -n 1)

          if [ -z "$SHA" ]; then
            echo "ERROR: commit aacdae671a not found"
            exit 1
          fi

          echo "Using commit:"
          echo "$SHA"

          git checkout "$SHA"

          git submodule update --init --recursive

          echo
          echo "HEAD:"
          git rev-parse HEAD

      - name: Patch jnigen for AArch64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          FILE="buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"

          echo "Patching:"
          echo "$FILE"

          grep -n \
            "BuildTarget.newDefaultTarget(Os.Linux" \
            "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"
          )

          text = file.read_text()

          old = """def linux64 = BuildTarget.newDefaultTarget(Os.Linux, Architecture.Bitness._64)
                addFreeTypeIfEnabled(linux64)"""

          new = """def linux64 = BuildTarget.newDefaultTarget(Os.Linux, Architecture.Bitness._64)
                linux64.compilerPrefix = 'aarch64-linux-gnu-'
                addFreeTypeIfEnabled(linux64)"""

          if old not in text:
              print("ERROR: target code was not found")
              print()
              print("Relevant lines:")
              for line in text.splitlines():
                  if "BuildTarget.newDefaultTarget(Os.Linux" in line:
                      print(line)

              raise SystemExit(1)

          text = text.replace(old, new, 1)

          file.write_text(text)

          print("ARM64 compilerPrefix inserted successfully")
          PY

          echo
          echo "===== PATCHED CODE ====="

          grep -n -A4 -B2 \
            "BuildTarget.newDefaultTarget(Os.Linux" \
            "$FILE"

      - name: Verify ARM64 compiler
        run: |
          echo "===== GCC ====="
          aarch64-linux-gnu-gcc --version

          echo
          echo "===== G++ ====="
          aarch64-linux-gnu-g++ --version

          echo
          echo "===== Compiler target ====="
          aarch64-linux-gnu-g++ -dumpmachine

          echo
          echo "Expected:"
          echo "aarch64-linux-gnu"

      - name: Build JNI ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      - name: Show generated libraries
        if: always()
        working-directory: imgui-java
        shell: bash
        run: |
          echo "===== GENERATED SO FILES ====="

          find . \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "===== FILE ARCHITECTURES ====="

          while IFS= read -r -d '' file; do
            echo
            echo "FILE: $file"
            file "$file"
          done < <(
            find . \
              -type f \
              -name "*.so" \
              -print0
          )

      - name: Verify AArch64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          LIB=$(find . \
            -type f \
            -name 'libimgui-java64.so' \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "ERROR: libimgui-java64.so was not found"

            echo
            echo "Available libraries:"

            find . \
              -type f \
              -name "*.so" \
              -print

            exit 1
          fi

          echo "Found library:"
          echo "$LIB"

          echo
          echo "===== FILE ====="

          file "$LIB"

          echo
          echo "===== ELF HEADER ====="

          readelf -h "$LIB"

          echo
          echo "===== ARCHITECTURE CHECK ====="

          MACHINE=$(readelf -h "$LIB" | grep 'Machine:')

          echo "$MACHINE"

          if echo "$MACHINE" | grep -q "AArch64"; then

            echo
            echo "=========================================="
            echo " SUCCESS: LIBRARY IS AARCH64"
            echo "=========================================="

          else

            echo
            echo "=========================================="
            echo " ERROR: LIBRARY IS NOT AARCH64"
            echo "=========================================="

            exit 1
          fi

      - name: Prepare artifact
        working-directory: imgui-java
        run: |
          set -e

          mkdir -p ../artifact

          LIB=$(find . \
            -type f \
            -name 'libimgui-java64.so' \
            -print -quit)

          cp "$LIB" \
            ../artifact/libimgui-java64.so

          echo
          echo "===== ARTIFACT ====="

          ls -lh \
            ../artifact/libimgui-java64.so

          file \
            ../artifact/libimgui-java64.so

      - name: Upload ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/libimgui-java64.so
          if-no-files-found: error

      - name: Print Gradle error log
        if: failure()
        shell: bash
        run: |
          echo "===== LAST 200 LINES ====="

          if [ -f gradle-build.log ]; then
            tail -n 200 gradle-build.log
          fi
