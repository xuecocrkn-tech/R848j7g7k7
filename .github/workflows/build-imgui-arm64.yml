name: Build imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            ant \
            make \
            python3 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file \
            binutils

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone exact imgui-java commit
        shell: bash
        run: |
          set -e

          git clone https://github.com/Moulberry/imgui-java.git imgui-java

          cd imgui-java

          git fetch --all --tags --prune

          SHA=$(git rev-list --all | grep '^aacdae671a' | head -n 1)

          if [ -z "$SHA" ]; then
            echo "ERROR: commit aacdae671a not found"
            exit 1
          fi

          echo "Using commit: $SHA"

          git checkout "$SHA"

          git submodule update --init --recursive

          echo
          echo "===== COMMIT ====="
          git rev-parse HEAD

      - name: Inspect Gradle tasks
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          ./gradlew tasks --all --no-daemon \
            | tee ../tasks.log

          echo
          echo "===== JNI / NATIVE TASKS ====="

          grep -Ei \
            "jnigen|native|generateLibs|compile.*linux|build.*linux" \
            ../tasks.log \
            || true

      - name: Patch Linux compiler
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          FILE="buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy")

          if not p.exists():
              raise SystemExit("GenerateLibs.groovy not found")

          s = p.read_text()

          old = "def linux64 = BuildTarget.newDefaultTarget(Os.Linux, Architecture.Bitness._64)"

          new = old + "\n            linux64.compilerPrefix = 'aarch64-linux-gnu-'"

          if "linux64.compilerPrefix" not in s:
              if old not in s:
                  raise SystemExit("Linux target declaration not found")

              s = s.replace(old, new, 1)
              p.write_text(s)

          print("===== LINUX TARGET =====")

          for n, line in enumerate(p.read_text().splitlines(), 1):
              if "linux64" in line:
                  print(f"{n}: {line}")
          PY

      - name: Generate JNI build files only
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          echo "===== GENERATING ====="

          ./gradlew \
            :imgui-binding:jnigen \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../generation.log

      - name: Inspect generated native files
        working-directory: imgui-java
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "GENERATED NATIVE FILES"
          echo "======================================"

          echo
          echo "===== BUILD XML ====="

          find . \
            -type f \
            \( \
              -name "*.xml" \
              -o -name "build.xml" \
            \) \
            -print

          echo
          echo "===== COMPILERS IN XML ====="

          grep -RniE \
            "g\+\+|gcc|aarch64|compilerPrefix" \
            . \
            --include="*.xml" \
            | head -n 300

          echo
          echo "===== JNI DIRECTORIES ====="

          find . \
            -type d \
            \( \
              -name "jni" \
              -o -name "native" \
              -o -name "build" \
            \) \
            -print \
            | head -n 100

      - name: Force ARM64 compiler in generated files
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          files = []

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue

              if p.suffix not in [".xml", ".properties", ".groovy", ".java"]:
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s

              s = s.replace(
                  "g++",
                  "aarch64-linux-gnu-g++"
              )

              s = s.replace(
                  "gcc",
                  "aarch64-linux-gnu-gcc"
              )

              if s != old:
                  p.write_text(s)
                  files.append(str(p))

          print("Patched files:")

          for f in files:
              print(f)

          print()
          print("Total:", len(files))
          PY

          echo
          echo "===== ARM64 REFERENCES ====="

          grep -RniE \
            "aarch64-linux-gnu-g\+\+|aarch64-linux-gnu-gcc" \
            . \
            --include="*.xml" \
            --include="*.properties" \
            | head -n 300 \
            || true

      - name: Find native build task
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          echo "===== TASKS ====="

          ./gradlew tasks --all --no-daemon \
            | grep -Ei \
              "jnigenBuild|native.*linux|linux.*native|build.*linux" \
            || true

      - name: Build Linux native target
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "ARM64 TOOLCHAIN"
          echo "======================================"

          aarch64-linux-gnu-gcc -dumpmachine
          aarch64-linux-gnu-g++ -dumpmachine

          echo
          echo "======================================"
          echo "BUILDING NATIVE TARGET"
          echo "======================================"

          ./gradlew \
            :imgui-binding:jnigenBuildLinux64 \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../native-build.log

      - name: Show SO files
        if: always()
        working-directory: imgui-java
        shell: bash
        run: |
          echo "===== SO FILES ====="

          find . \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "===== FILE ====="

          while IFS= read -r -d '' f; do
            file "$f"
          done < <(
            find . \
              -type f \
              -name "*.so" \
              -print0
          )

      - name: Verify ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "ERROR: libimgui-java64.so not found"
            exit 1
          fi

          echo "LIBRARY:"
          echo "$LIB"

          echo
          file "$LIB"

          echo
          readelf -h "$LIB" | grep "Machine:"

          if readelf -h "$LIB" | grep -q "Machine:.*AArch64"; then

            echo
            echo "======================================"
            echo "       ARM64 SUCCESS"
            echo "======================================"

          else

            echo
            echo "======================================"
            echo "       WRONG ARCHITECTURE"
            echo "======================================"

            exit 1
          fi

      - name: Prepare artifact
        if: success()
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          mkdir -p ../artifact

          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          cp "$LIB" ../artifact/libimgui-java64.so

          file ../artifact/libimgui-java64.so

          ls -lh ../artifact/libimgui-java64.so

      - name: Upload ARM64 library
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/libimgui-java64.so
          if-no-files-found: error

      - name: Failure diagnostics
        if: failure()
        working-directory: imgui-java
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "FAILURE DIAGNOSTICS"
          echo "======================================"

          echo
          echo "===== NATIVE TASKS ====="

          ./gradlew tasks --all --no-daemon \
            | grep -Ei \
              "jnigen|native|linux" \
            | head -n 200

          echo
          echo "===== GENERATED COMPILER COMMANDS ====="

          grep -RniE \
            "aarch64-linux-gnu|g\+\+|gcc|clang" \
            . \
            --include="*.xml" \
            --include="*.properties" \
            | tail -n 200

          echo
          echo "===== ERRORS ====="

          if [ -f ../native-build.log ]; then
            grep -nEi \
              "FAILURE:|Execution failed|Caused by:|error:|fatal error|undefined reference|cannot find|not found" \
              ../native-build.log \
              | head -n 200
          fi

          echo
          echo "===== LAST LOG ====="

          if [ -f ../native-build.log ]; then
            tail -n 200 ../native-build.log
          fi
