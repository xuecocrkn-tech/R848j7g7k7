name: Build imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ant \
            make \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file \
            binutils

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone imgui-java
        run: |
          git clone https://github.com/Moulberry/imgui-java.git imgui-java

          cd imgui-java

          git fetch --all --tags --prune

          SHA=$(git rev-list --all | grep '^aacdae671a' | head -n 1)

          if [ -z "$SHA" ]; then
            echo "ERROR: commit aacdae671a was not found"
            exit 1
          fi

          echo "Using commit:"
          echo "$SHA"

          git checkout "$SHA"
          git submodule update --init --recursive

          echo "Current commit:"
          git rev-parse HEAD

      - name: Find native compiler commands
        working-directory: imgui-java
        run: |
          echo "Searching build files..."

          grep -RniE \
            'g\+\+|gcc|clang\+\+|clang' \
            buildSrc imgui-binding \
            --exclude-dir=.gradle \
            --exclude='*.class' \
            || true

      - name: Patch native compiler
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          echo "Patching compiler commands..."

          while IFS= read -r -d '' file; do
            echo "Patching: $file"

            sed -i \
              -e 's/\bg++\b/aarch64-linux-gnu-g++/g' \
              -e 's/\bgcc\b/aarch64-linux-gnu-gcc/g' \
              "$file"

          done < <(
            find buildSrc imgui-binding \
              -type f \
              \( \
                -name "*.xml" -o \
                -name "*.gradle" -o \
                -name "*.groovy" -o \
                -name "*.kts" -o \
                -name "*.sh" -o \
                -name "*.java" -o \
                -name "*.kt" \
              \) \
              -print0
          )

          echo
          echo "Checking patched compiler names..."

          grep -RniE \
            'aarch64-linux-gnu-g\+\+|aarch64-linux-gnu-gcc' \
            buildSrc imgui-binding \
            --exclude-dir=.gradle \
            --exclude='*.class' \
            || true

      - name: Configure ARM64 toolchain
        run: |
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "AS=aarch64-linux-gnu-as" >> "$GITHUB_ENV"
          echo "LD=aarch64-linux-gnu-ld" >> "$GITHUB_ENV"
          echo "RANLIB=aarch64-linux-gnu-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=aarch64-linux-gnu-strip" >> "$GITHUB_ENV"

          echo "===== GCC ====="
          aarch64-linux-gnu-gcc --version

          echo
          echo "===== G++ ====="
          aarch64-linux-gnu-g++ --version

      - name: Build JNI ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      - name: Find generated SO files
        if: always()
        working-directory: imgui-java
        shell: bash
        run: |
          echo "===== SO FILES ====="

          find . \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "===== FILE INFO ====="

          while IFS= read -r -d '' file; do
            file "$file"
          done < <(
            find . \
              -type f \
              -name "*.so" \
              -print0
          )

      - name: Verify ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          LIB=$(find . \
            -type f \
            -name 'libimgui-java64.so' \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "ERROR: libimgui-java64.so was not found"
            echo
            echo "Available SO files:"

            find . \
              -type f \
              -name "*.so" \
              -print

            exit 1
          fi

          echo "Found library:"
          echo "$LIB"

          echo
          echo "===== ELF ====="

          readelf -h "$LIB"

          MACHINE=$(readelf -h "$LIB" | grep 'Machine:')

          echo
          echo "Machine:"
          echo "$MACHINE"

          if echo "$MACHINE" | grep -q "AArch64"; then
            echo
            echo "================================"
            echo "SUCCESS: ARM64 LIBRARY"
            echo "================================"
          else
            echo
            echo "================================"
            echo "WRONG ARCHITECTURE"
            echo "================================"
            exit 1
          fi

          echo
          file "$LIB"

      - name: Prepare artifact
        working-directory: imgui-java
        run: |
          mkdir -p ../artifact

          LIB=$(find . \
            -type f \
            -name 'libimgui-java64.so' \
            -print -quit)

          cp "$LIB" ../artifact/libimgui-java64.so

          ls -lh ../artifact/libimgui-java64.so

      - name: Upload ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/libimgui-java64.so
          if-no-files-found: error

      - name: Print Gradle log
        if: failure()
        shell: bash
        run: |
          echo "===== LAST 150 LINES OF GRADLE LOG ====="

          if [ -f imgui-java/../gradle-build.log ]; then
            tail -n 150 gradle-build.log
          fi
