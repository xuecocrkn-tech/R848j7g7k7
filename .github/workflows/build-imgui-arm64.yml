name: Build imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ant \
            make \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file \
            binutils

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone exact imgui-java commit
        shell: bash
        run: |
          git clone https://github.com/Moulberry/imgui-java.git imgui-java
          cd imgui-java

          git fetch --all --tags --prune

          SHA="$(git rev-list --all | grep '^aacdae671a' | head -n 1)"

          if [ -z "$SHA" ]; then
            echo "ERROR: commit aacdae671a not found"
            exit 1
          fi

          echo "Found commit: $SHA"

          git checkout "$SHA"
          git submodule update --init --recursive

          echo "HEAD:"
          git rev-parse HEAD

      - name: Show native build files
        working-directory: imgui-java
        shell: bash
        run: |
          echo "Searching for compiler commands..."

          grep -RniE \
            'g\+\+|gcc|clang\+\+|clang|linux64|libimgui-java64' \
            buildSrc imgui-binding \
            --exclude-dir=.gradle \
            --exclude='*.class' \
            || true

      - name: Patch compiler for ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          echo "Before patch:"
          grep -RniE \
            'g\+\+|gcc|clang\+\+|clang' \
            buildSrc imgui-binding \
            --exclude-dir=.gradle \
            --exclude='*.class' \
            || true

          echo
          echo "Replacing native compiler commands..."

          # Replace common hardcoded compiler names.
          find buildSrc imgui-binding -type f \
            -name "*.xml" -o -name "*.gradle" -o -name "*.groovy" \
               -o -name "*.sh" -o -name "*.java" \
            -print0 |
          while IFS= read -r -d '' file; do

            sed -i \
              -e 's/\bg++\b/aarch64-linux-gnu-g++/g' \
              -e 's/\bgcc\b/aarch64-linux-gnu-gcc/g' \
              "$file"

          done

          echo
          echo "After patch:"
          grep -RniE \
            'aarch64-linux-gnu-g\+\+|aarch64-linux-gnu-gcc' \
            buildSrc imgui-binding \
            --exclude-dir=.gradle \
            || true

      - name: Configure ARM64 compiler
        working-directory: imgui-java
        run: |
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "AS=aarch64-linux-gnu-as" >> "$GITHUB_ENV"
          echo "LD=aarch64-linux-gnu-ld" >> "$GITHUB_ENV"
          echo "RANLIB=aarch64-linux-gnu-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=aarch64-linux-gnu-strip" >> "$GITHUB_ENV"

          echo "Compiler versions:"
          aarch64-linux-gnu-g++ --version
          aarch64-linux-gnu-gcc --version

      - name: Build JNI ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      - name: Find generated libraries
        if: always()
        working-directory: imgui-java
        run: |
          echo "===== ALL SO FILES ====="

          find . -type f -name "*.so" -print

          echo
          echo "===== FILE INFORMATION ====="

          find . -type f -name "*.so" -exec file {} \;

      - name: Verify ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          LIB="$(find . -type f -name 'libimgui-java64.so' | head -n 1)"

          if [ -z "$LIB" ]; then
            echo "ERROR: libimgui-java64.so was not produced!"
            exit 1
          fi

          echo "Found:"
          echo "$LIB"

          echo
          echo "===== ELF HEADER ====="

          readelf -h "$LIB"

          MACHINE="$(readelf -h "$LIB" | grep 'Machine:' | sed 's/.*Machine:[[:space:]]*//')"

          echo
          echo "Detected architecture:"
          echo "$MACHINE"

          if [[ "$MACHINE"
