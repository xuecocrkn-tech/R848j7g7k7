name: Build Moulberry imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Clone repository
      # ------------------------------------------------------------
      - name: Clone Moulberry imgui-java
        shell: bash
        run: |
          set -eux

          git clone --recurse-submodules \
            https://github.com/Moulberry/imgui-java.git \
            imgui-java

          cd imgui-java

          # Получаем все refs/objects, чтобы короткий SHA можно было найти.
          git fetch --all --tags --prune

          # Ищем commit по короткому SHA.
          TARGET="aacdae671a"

          FULL_SHA="$(git rev-list --all | grep "^${TARGET}" | head -n 1 || true)"

          if [ -z "$FULL_SHA" ]; then
            echo "::error::Commit ${TARGET} не найден в Moulberry/imgui-java"
            echo "Последние commits:"
            git log --oneline --all -20
            exit 1
          fi

          echo "Found commit:"
          echo "$FULL_SHA"

          git checkout "$FULL_SHA"

          # После checkout обязательно обновляем submodules.
          git submodule sync --recursive
          git submodule update --init --recursive

          echo "Actual HEAD:"
          git rev-parse HEAD

          echo "Submodules:"
          git submodule status


      # ------------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ------------------------------------------------------------
      # 3. ARM64 cross compiler
      # ------------------------------------------------------------
      - name: Install ARM64 toolchain
        shell: bash
        run: |
          set -eux

          sudo dpkg --add-architecture arm64
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            make \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross


      # ------------------------------------------------------------
      # 4. Check toolchain
      # ------------------------------------------------------------
      - name: Check ARM64 compiler
        shell: bash
        run: |
          set -eux

          java -version

          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version

          aarch64-linux-gnu-gcc \
            -dumpmachine

          echo "Expected:"
          echo "aarch64-linux-gnu"


      # ------------------------------------------------------------
      # 5. Build JNI
      # ------------------------------------------------------------
      - name: Build ARM64 native library
        working-directory: imgui-java
        shell: bash
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          AR: aarch64-linux-gnu-ar
          RANLIB: aarch64-linux-gnu-ranlib
          STRIP: aarch64-linux-gnu-strip
        run: |
          set -eux

          chmod +x gradlew

          echo "CC=$CC"
          echo "CXX=$CXX"

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace


      # ------------------------------------------------------------
      # 6. Find all produced .so files
      # ------------------------------------------------------------
      - name: Locate native libraries
        working-directory: imgui-java
        shell: bash
        run: |
          set -eux

          echo "Searching for .so files..."

          find . \
            -type f \
            -name "*.so" \
            -print


      # ------------------------------------------------------------
      # 7. Find libimgui-java64.so
      # ------------------------------------------------------------
      - name: Locate libimgui-java64.so
        working-directory: imgui-java
        shell: bash
        run: |
          set -eux

          LIB="$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)"

          if [ -z "$LIB" ]; then
            echo "::error::libimgui-java64.so was not produced."

            echo "Available native files:"
            find . \
              -type f \
              -name "*.so" \
              -print

            exit 1
          fi

          echo "Found:"
          echo "$LIB"

          echo "$LIB" > /tmp/imgui_library_path.txt


      # ------------------------------------------------------------
      # 8. Verify ELF architecture
      # ------------------------------------------------------------
      - name: Verify AArch64 ELF
        working-directory: imgui-java
        shell: bash
        run: |
          set -eux

          LIB="$(cat /tmp/imgui_library_path.txt)"

          echo "Checking:"
          echo "$LIB"

          file "$LIB"

          readelf -h "$LIB"


      # ------------------------------------------------------------
      # 9. HARD architecture check
      # ------------------------------------------------------------
      - name: Reject non-ARM64 library
        working-directory: imgui-java
        shell: bash
        run: |
          set -eux

          LIB="$(cat /tmp/imgui_library_path.txt)"

          MACHINE="$(readelf -h "$LIB" | \
            awk -F: '/Machine:/ {print $2}' | \
            xargs)"

          echo "Detected machine:"
          echo "$MACHINE"

          if [[ "$MACHINE" != *"AArch64"* ]]; then
            echo "::error::The generated library is NOT AArch64."
            echo "::error::Detected: $MACHINE"
            exit 1
          fi

          echo "SUCCESS: ARM64/AArch64 library confirmed."


      # ------------------------------------------------------------
      # 10. Prepare artifact
      # ------------------------------------------------------------
      - name: Prepare artifact
        working-directory: imgui-java
        shell: bash
        run: |
          set -eux

          LIB="$(cat /tmp/imgui_library_path.txt)"

          mkdir -p ../artifact

          cp "$LIB" \
            ../artifact/libimgui-java64.so

          # Дополнительная информация для проверки.
          git rev-parse HEAD \
            > ../artifact/SOURCE_COMMIT.txt

          readelf -h "$LIB" \
            > ../artifact/ELF_HEADER.txt

          file "$LIB" \
            > ../artifact/FILE_INFO.txt

          ls -lh ../artifact/


      # ------------------------------------------------------------
      # 11. Upload artifact
      # ------------------------------------------------------------
      - name: Upload ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
