name: Build imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            ant \
            make \
            python3 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file \
            binutils

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone exact imgui-java commit
        shell: bash
        run: |
          set -e

          git clone https://github.com/Moulberry/imgui-java.git imgui-java

          cd imgui-java

          git fetch --all --tags --prune

          SHA=$(git rev-list --all | grep '^aacdae671a' | head -n 1)

          if [ -z "$SHA" ]; then
            echo "ERROR: commit aacdae671a not found"
            exit 1
          fi

          echo "Using commit: $SHA"

          git checkout "$SHA"

          git submodule update --init --recursive

          echo
          echo "===== COMMIT ====="
          git rev-parse HEAD

      - name: Patch Linux target
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          FILE="buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy")
          s = p.read_text()

          old = "def linux64 = BuildTarget.newDefaultTarget(Os.Linux, Architecture.Bitness._64)"
          new = old + "\n            linux64.compilerPrefix = 'aarch64-linux-gnu-'"

          if "linux64.compilerPrefix" in s:
              print("compilerPrefix already present")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("compilerPrefix added")
          else:
              print("ERROR: Linux target not found")
              raise SystemExit(1)
          PY

          echo
          grep -n -A4 -B2 \
            "BuildTarget.newDefaultTarget(Os.Linux" \
            "$FILE"

      - name: Verify cross compiler
        run: |
          set -e

          echo "===== CROSS COMPILER ====="

          which aarch64-linux-gnu-gcc
          which aarch64-linux-gnu-g++

          echo
          aarch64-linux-gnu-gcc --version

          echo
          aarch64-linux-gnu-g++ --version

          echo
          echo "Target:"
          aarch64-linux-gnu-g++ -dumpmachine

          test "$(aarch64-linux-gnu-g++ -dumpmachine)" = "aarch64-linux-gnu"

      - name: Configure environment
        run: |
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "AS=aarch64-linux-gnu-as" >> "$GITHUB_ENV"
          echo "LD=aarch64-linux-gnu-ld" >> "$GITHUB_ENV"
          echo "RANLIB=aarch64-linux-gnu-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=aarch64-linux-gnu-strip" >> "$GITHUB_ENV"

      - name: Build JNI
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          set +e

          LOG="gradle-build.log"

          echo
          echo "=================================================="
          echo "              BUILD FAILURE DIAGNOSTICS"
          echo "=================================================="

          if [ ! -f "$LOG" ]; then
            echo "ERROR: gradle-build.log does not exist"
            exit 0
          fi

          echo
          echo "=================================================="
          echo "FIRST IMPORTANT ERRORS"
          echo "=================================================="

          grep -nEi \
            "Execution failed for task|FAILURE:|Caused by:|error:|fatal error:|undefined reference|cannot find|not found|No such file|Permission denied|Exception" \
            "$LOG" \
            | head -n 80

          echo
          echo "=================================================="
          echo "COMPILER COMMANDS"
          echo "=================================================="

          grep -nEi \
            "aarch64-linux-gnu-g\+\+|aarch64-linux-gnu-gcc|g\+\+|gcc|clang" \
            "$LOG" \
            | tail -n 80

          echo
          echo "=================================================="
          echo "LAST FAILED TASK"
          echo "=================================================="

          grep -nEi \
            "Execution failed for task" \
            "$LOG" \
            | tail -n 10

          echo
          echo "=================================================="
          echo "CONTEXT AROUND FIRST 'Caused by:'"
          echo "=================================================="

          LINE=$(grep -nEi "Caused by:" "$LOG" | head -n 1 | cut -d: -f1)

          if [ -n "$LINE" ]; then
            START=$((LINE - 20))
            END=$((LINE + 50))

            if [ "$START" -lt 1 ]; then
              START=1
            fi

            sed -n "${START},${END}p" "$LOG"
          else
            echo "No 'Caused by:' found."
          fi

          echo
          echo "=================================================="
          echo "LAST 100 LINES"
          echo "=================================================="

          tail -n 100 "$LOG"

      - name: Show generated libraries
        if: always()
        working-directory: imgui-java
        shell: bash
        run: |
          echo "===== SO FILES ====="

          find . \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "===== ARCHITECTURES ====="

          while IFS= read -r -d '' f; do
            echo
            echo "FILE: $f"
            file "$f"
          done < <(
            find . \
              -type f \
              -name "*.so" \
              -print0
          )

      - name: Verify ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "libimgui-java64.so was not created"
            exit 1
          fi

          echo "Library:"
          echo "$LIB"

          echo
          file "$LIB"

          echo
          readelf -h "$LIB" | grep "Machine:"

          if readelf -h "$LIB" | grep -q "Machine:.*AArch64"; then
            echo
            echo "======================================"
            echo " ARM64 BUILD SUCCESSFUL"
            echo "======================================"
          else
            echo
            echo "======================================"
            echo " WRONG ARCHITECTURE"
            echo "======================================"
            exit 1
          fi

      - name: Prepare artifact
        if: success()
        working-directory: imgui-java
        run: |
          set -e

          mkdir -p ../artifact

          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          cp "$LIB" \
            ../artifact/libimgui-java64.so

          file ../artifact/libimgui-java64.so
          ls -lh ../artifact/libimgui-java64.so

      - name: Upload ARM64 library
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/libimgui-java64.so
          if-no-files-found: error
