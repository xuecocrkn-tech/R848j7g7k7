name: Build imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            ant \
            make \
            python3 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file \
            binutils

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone exact imgui-java commit
        shell: bash
        run: |
          set -e

          git clone https://github.com/Moulberry/imgui-java.git imgui-java

          cd imgui-java

          git fetch --all --tags --prune

          SHA=$(git rev-list --all | grep '^aacdae671a' | head -n 1)

          if [ -z "$SHA" ]; then
            echo "ERROR: commit aacdae671a not found"
            exit 1
          fi

          echo "Using commit:"
          echo "$SHA"

          git checkout "$SHA"

          git submodule update --init --recursive

          echo
          echo "===== COMMIT ====="
          git rev-parse HEAD

      - name: Inspect native build
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          FILE="buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"

          echo "===== LINUX TARGET ====="

          grep -n -A10 -B5 \
            "BuildTarget.newDefaultTarget(Os.Linux" \
            "$FILE"

      - name: Patch jnigen for AArch64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          FILE="buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"

          echo "Patching:"
          echo "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"
          )

          text = file.read_text()

          old = (
              "def linux64 = "
              "BuildTarget.newDefaultTarget("
              "Os.Linux, Architecture.Bitness._64)"
          )

          new = (
              old
              + "\n"
              + "            linux64.compilerPrefix = "
              + "'aarch64-linux-gnu-'"
          )

          if "linux64.compilerPrefix" in text:
              print("compilerPrefix already exists")

          elif old in text:
              text = text.replace(old, new, 1)
              file.write_text(text)
              print("ARM64 compilerPrefix inserted")

          else:
              print("ERROR: Linux target line not found")

              for line in text.splitlines():
                  if "BuildTarget.newDefaultTarget(Os.Linux" in line:
                      print(line)

              raise SystemExit(1)
          PY

          echo
          echo "===== PATCHED TARGET ====="

          grep -n -A5 -B2 \
            "BuildTarget.newDefaultTarget(Os.Linux" \
            "$FILE"

          echo
          echo "===== COMPILER PREFIX ====="

          grep -n \
            "compilerPrefix" \
            "$FILE"

      - name: Verify cross compiler
        shell: bash
        run: |
          set -e

          echo "===== GCC ====="
          aarch64-linux-gnu-gcc --version

          echo
          echo "===== G++ ====="
          aarch64-linux-gnu-g++ --version

          echo
          echo "===== TARGET ====="

          TARGET=$(aarch64-linux-gnu-g++ -dumpmachine)

          echo "$TARGET"

          if [ "$TARGET" != "aarch64-linux-gnu" ]; then
            echo "ERROR: wrong compiler target"
            exit 1
          fi

          echo
          echo "ARM64 CROSS COMPILER OK"

      - name: Configure ARM64 environment
        run: |
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "AS=aarch64-linux-gnu-as" >> "$GITHUB_ENV"
          echo "LD=aarch64-linux-gnu-ld" >> "$GITHUB_ENV"
          echo "RANLIB=aarch64-linux-gnu-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=aarch64-linux-gnu-strip" >> "$GITHUB_ENV"

      - name: Build JNI ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo " BUILDING IMGUI-JAVA ARM64"
          echo "=========================================="

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      - name: Show generated libraries
        if: always()
        working-directory: imgui-java
        shell: bash
        run: |
          echo "=========================================="
          echo " GENERATED SO FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "=========================================="
          echo " ARCHITECTURES"
          echo "=========================================="

          while IFS= read -r -d '' file; do
            echo
            echo "FILE: $file"
            file "$file"
          done < <(
            find . \
              -type f \
              -name "*.so" \
              -print0
          )

      - name: Verify AArch64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          LIB=$(find . \
            -type f \
            -name 'libimgui-java64.so' \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "ERROR: libimgui-java64.so not found"

            echo
            echo "Available libraries:"

            find . \
              -type f \
              -name "*.so" \
              -print

            exit 1
          fi

          echo "Found:"
          echo "$LIB"

          echo
          echo "===== FILE ====="

          file "$LIB"

          echo
          echo "===== ELF HEADER ====="

          readelf -h "$LIB"

          echo
          echo "===== MACHINE ====="

          MACHINE=$(readelf -h "$LIB" | grep 'Machine:')

          echo "$MACHINE"

          if echo "$MACHINE" | grep -q "AArch64"; then

            echo
            echo "=========================================="
            echo " SUCCESS: AARCH64"
            echo "=========================================="

          else

            echo
            echo "=========================================="
            echo " WRONG ARCHITECTURE"
            echo "=========================================="

            exit 1
          fi

      - name: Prepare artifact
        working-directory: imgui-java
        run: |
          set -e

          mkdir -p ../artifact

          LIB=$(find . \
            -type f \
            -name 'libimgui-java64.so' \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "ERROR: library not found"
            exit 1
          fi

          cp "$LIB" \
            ../artifact/libimgui-java64.so

          echo "===== ARTIFACT ====="

          ls -lh \
            ../artifact/libimgui-java64.so

          file \
            ../artifact/libimgui-java64.so

      - name: Upload ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/libimgui-java64.so
          if-no-files-found: error

      - name: Print exact build error
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo " EXACT BUILD ERRORS"
          echo "=========================================="

          if [ -f gradle-build.log ]; then

            echo
            echo "===== IMPORTANT ERROR LINES ====="

            grep -nEi \
              "error:|fatal error:|FAILED|FAILURE:|Caused by:|aarch64|g\+\+|gcc|undefined reference|cannot find|No such file|not found" \
              gradle-build.log \
              | tail -n 150 \
              || true

            echo
            echo "=========================================="
            echo " LAST 250 LOG LINES"
            echo "=========================================="

            tail -n 250 gradle-build.log

          else
            echo "gradle-build.log was not created"
          fi
