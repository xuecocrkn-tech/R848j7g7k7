name: Build imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            ant \
            make \
            python3 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file \
            binutils

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone exact imgui-java commit
        shell: bash
        run: |
          set -e

          git clone https://github.com/Moulberry/imgui-java.git imgui-java

          cd imgui-java

          git fetch --all --tags --prune

          SHA=$(git rev-list --all | grep '^aacdae671a' | head -n 1)

          if [ -z "$SHA" ]; then
            echo "ERROR: commit aacdae671a not found"
            exit 1
          fi

          echo "Using commit: $SHA"

          git checkout "$SHA"
          git submodule update --init --recursive

          echo "===== COMMIT ====="
          git rev-parse HEAD

      - name: Create ARM64 compiler wrappers
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/arm64-tools"

          cat > "$HOME/arm64-tools/gcc" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-gcc "$@"
          EOF

          cat > "$HOME/arm64-tools/g++" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-g++ "$@"
          EOF

          cat > "$HOME/arm64-tools/cc" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-gcc "$@"
          EOF

          cat > "$HOME/arm64-tools/c++" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-g++ "$@"
          EOF

          cat > "$HOME/arm64-tools/ar" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-ar "$@"
          EOF

          cat > "$HOME/arm64-tools/ld" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-ld "$@"
          EOF

          cat > "$HOME/arm64-tools/strip" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-strip "$@"
          EOF

          cat > "$HOME/arm64-tools/ranlib" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-ranlib "$@"
          EOF

          cat > "$HOME/arm64-tools/nm" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-nm "$@"
          EOF

          chmod +x "$HOME/arm64-tools/"*

          echo "$HOME/arm64-tools" >> "$GITHUB_PATH"

      - name: Verify compiler interception
        shell: bash
        run: |
          set -e

          echo "===== PATH ====="
          which gcc
          which g++
          which cc
          which c++

          echo
          echo "===== GCC TARGET ====="
          gcc -dumpmachine

          echo
          echo "===== G++ TARGET ====="
          g++ -dumpmachine

          test "$(gcc -dumpmachine)" = "aarch64-linux-gnu"
          test "$(g++ -dumpmachine)" = "aarch64-linux-gnu"

          echo
          echo "======================================"
          echo " ARM64 COMPILER ACTIVE"
          echo "======================================"

      - name: Patch build configuration
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          FILE="buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy")
          s = p.read_text()

          old = "def linux64 = BuildTarget.newDefaultTarget(Os.Linux, Architecture.Bitness._64)"

          if "linux64.compilerPrefix" in s:
              print("compilerPrefix already present")
          elif old in s:
              s = s.replace(
                  old,
                  old + "\n            linux64.compilerPrefix = 'aarch64-linux-gnu-'",
                  1
              )
              p.write_text(s)
              print("compilerPrefix added")
          else:
              print("Linux target not found")
              raise SystemExit(1)
          PY

          echo
          grep -n -A5 -B2 \
            "BuildTarget.newDefaultTarget(Os.Linux" \
            "$FILE"

      - name: Build JNI ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          echo "===== ENVIRONMENT ====="
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "PATH=$PATH"

          echo
          echo "===== COMPILERS ====="
          which gcc
          which g++
          gcc -dumpmachine
          g++ -dumpmachine

          echo
          echo "===== BUILD ====="

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      - name: Diagnose failure
        if: failure()
        shell: bash
        run: |
          set +e

          LOG="gradle-build.log"

          echo
          echo "=================================================="
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "=================================================="

          if [ ! -f "$LOG" ]; then
            echo "gradle-build.log not found"
            exit 0
          fi

          echo
          echo "===== IMPORTANT ERRORS ====="

          grep -nEi \
            "Execution failed for task|FAILURE:|Caused by:|error:|fatal error:|undefined reference|cannot find|not found|No such file|Permission denied|Exception" \
            "$LOG" \
            | head -n 120

          echo
          echo "===== COMPILER COMMANDS ====="

          grep -nEi \
            "aarch64-linux-gnu|g\+\+|gcc|clang" \
            "$LOG" \
            | tail -n 150

          echo
          echo "===== FAILED TASKS ====="

          grep -nEi \
            "Execution failed for task" \
            "$LOG" \
            | tail -n 20

          echo
          echo "===== LAST 150 LINES ====="

          tail -n 150 "$LOG"

      - name: Show generated libraries
        if: always()
        working-directory: imgui-java
        shell: bash
        run: |
          echo "===== SO FILES ====="

          find . \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "===== FILE TYPES ====="

          while IFS= read -r -d '' f; do
            echo
            echo "FILE: $f"
            file "$f"
          done < <(
            find . \
              -type f \
              -name "*.so" \
              -print0
          )

      - name: Verify ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "ERROR: libimgui-java64.so was not created"
            exit 1
          fi

          echo "===== LIBRARY ====="
          echo "$LIB"

          echo
          echo "===== FILE ====="
          file "$LIB"

          echo
          echo "===== ELF MACHINE ====="
          readelf -h "$LIB" | grep "Machine:"

          if readelf -h "$LIB" | grep -q "Machine:.*AArch64"; then

            echo
            echo "======================================"
            echo " ARM64 BUILD SUCCESSFUL"
            echo "======================================"

          else

            echo
            echo "======================================"
            echo " WRONG ARCHITECTURE"
            echo "======================================"

            exit 1
          fi

      - name: Prepare artifact
        if: success()
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          mkdir -p ../artifact

          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          cp "$LIB" ../artifact/libimgui-java64.so

          file ../artifact/libimgui-java64.so

          ls -lh ../artifact/libimgui-java64.so

      - name: Upload ARM64 library
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/libimgui-java64.so
          if-no-files-found: error
