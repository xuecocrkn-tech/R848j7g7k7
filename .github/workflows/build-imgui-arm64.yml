name: Build imgui-java ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            ant \
            make \
            python3 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file \
            binutils

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone exact imgui-java commit
        shell: bash
        run: |
          set -e

          git clone https://github.com/Moulberry/imgui-java.git imgui-java

          cd imgui-java

          git fetch --all --tags --prune

          SHA=$(git rev-list --all | grep '^aacdae671a' | head -n 1)

          if [ -z "$SHA" ]; then
            echo "ERROR: commit aacdae671a not found"
            exit 1
          fi

          git checkout "$SHA"

          git submodule update --init --recursive

          echo "===== COMMIT ====="
          git rev-parse HEAD

      - name: Patch Linux compiler prefix
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          FILE="buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy")
          s = p.read_text()

          old = "def linux64 = BuildTarget.newDefaultTarget(Os.Linux, Architecture.Bitness._64)"

          if "linux64.compilerPrefix" not in s:
              if old not in s:
                  raise SystemExit("Linux target not found")

              s = s.replace(
                  old,
                  old + "\n            linux64.compilerPrefix = 'aarch64-linux-gnu-'",
                  1
              )

              p.write_text(s)

          print("===== PATCHED SOURCE =====")

          for i, line in enumerate(p.read_text().splitlines(), 1):
              if "linux64" in line:
                  print(f"{i}: {line}")
          PY

      - name: Generate native build files
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          echo "===== GENERATING JNIGEN FILES ====="

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info

          echo
          echo "===== SEARCHING GENERATED BUILD FILES ====="

          find . \
            -type f \
            \( -name "build-linux64.xml" -o -name "build-linux.xml" \) \
            -print

      - name: Inspect generated Ant files
        working-directory: imgui-java
        shell: bash
        run: |
          set +e

          echo "===== ALL XML FILES ====="

          find . \
            -type f \
            -name "*.xml" \
            -print

          echo
          echo "===== COMPILER REFERENCES ====="

          grep -RniE \
            "g\+\+|gcc|compiler|cppCompiler|cCompiler" \
            . \
            --include="*.xml" \
            | head -n 200

      - name: Force ARM64 in generated build files
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          echo "===== BEFORE PATCH ====="

          grep -RniE \
            "g\+\+|gcc" \
            . \
            --include="*.xml" \
            | head -n 100 || true

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "g++": "aarch64-linux-gnu-g++",
              "gcc": "aarch64-linux-gnu-gcc",
          }

          count = 0

          for p in Path(".").rglob("*.xml"):
              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s

              for a, b in replacements.items():
                  s = s.replace(a, b)

              if s != old:
                  p.write_text(s)
                  count += 1
                  print("PATCHED:", p)

          print()
          print("XML FILES PATCHED:", count)
          PY

          echo
          echo "===== AFTER PATCH ====="

          grep -RniE \
            "aarch64-linux-gnu-g\+\+|aarch64-linux-gnu-gcc" \
            . \
            --include="*.xml" \
            | head -n 200 || true

      - name: Build native library
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          echo "===== ARM64 COMPILER ====="

          aarch64-linux-gnu-g++ -dumpmachine
          aarch64-linux-gnu-gcc -dumpmachine

          echo
          echo "===== BUILD ====="

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      - name: Show generated libraries
        if: always()
        working-directory: imgui-java
        shell: bash
        run: |
          echo "===== SO FILES ====="

          find . \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "===== FILE TYPES ====="

          while IFS= read -r -d '' f; do
            echo
            echo "FILE: $f"
            file "$f"
          done < <(
            find . \
              -type f \
              -name "*.so" \
              -print0
          )

      - name: Verify ARM64
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "ERROR: libimgui-java64.so not found"
            exit 1
          fi

          echo "===== LIBRARY ====="
          echo "$LIB"

          echo
          echo "===== FILE ====="
          file "$LIB"

          echo
          echo "===== ELF ====="
          readelf -h "$LIB" | grep "Machine:"

          if readelf -h "$LIB" | grep -q "Machine:.*AArch64"; then
            echo
            echo "======================================"
            echo " ARM64 BUILD SUCCESSFUL"
            echo "======================================"
          else
            echo
            echo "======================================"
            echo " WRONG ARCHITECTURE"
            echo "======================================"
            exit 1
          fi

      - name: Prepare artifact
        if: success()
        working-directory: imgui-java
        shell: bash
        run: |
          set -e

          mkdir -p ../artifact

          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          cp "$LIB" ../artifact/libimgui-java64.so

          file ../artifact/libimgui-java64.so
          ls -lh ../artifact/libimgui-java64.so

      - name: Upload ARM64 library
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/libimgui-java64.so
          if-no-files-found: error

      - name: Diagnostics
        if: failure()
        working-directory: imgui-java
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "BUILD DIAGNOSTICS"
          echo "======================================"

          echo
          echo "===== GENERATED XML COMPILERS ====="

          grep -RniE \
            "aarch64-linux-gnu|g\+\+|gcc" \
            . \
            --include="*.xml" \
            | tail -n 200

          echo
          echo "===== IMPORTANT ERRORS ====="

          if [ -f ../gradle-build.log ]; then
            grep -nEi \
              "FAILURE:|Execution failed|Caused by:|error:|fatal error|undefined reference|cannot find|not found" \
              ../gradle-build.log \
              | head -n 150
          fi

          echo
          echo "===== LAST LOG ====="

          if [ -f ../gradle-build.log ]; then
            tail -n 150 ../gradle-build.log
          fi
