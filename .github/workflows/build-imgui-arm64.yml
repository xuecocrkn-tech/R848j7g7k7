name: Build imgui-java Linux ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AArch64 JNI
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Clone repository
      # ============================================================

      - name: Clone Moulberry imgui-java
        shell: bash
        run: |
          set -eux

          git clone \
            https://github.com/Moulberry/imgui-java.git \
            imgui-java

          cd imgui-java

          git fetch --all --tags --prune

          TARGET="aacdae671a"

          echo "Searching for commit $TARGET ..."

          FULL_SHA=$(git rev-list --all | grep "^${TARGET}" | head -n 1 || true)

          if [ -z "$FULL_SHA" ]; then
            echo "::error::Commit $TARGET was not found."
            echo "Available commits:"
            git log --all --oneline -30
            exit 1
          fi

          echo "Found:"
          echo "$FULL_SHA"

          git checkout "$FULL_SHA"

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "======================================"
          echo "SOURCE COMMIT"
          echo "======================================"

          git rev-parse HEAD

          echo "======================================"
          echo "SUBMODULES"
          echo "======================================"

          git submodule status


      # ============================================================
      # 2. Java
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. ARM64 compiler
      # ============================================================

      - name: Install ARM64 toolchain
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            make \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross


      # ============================================================
      # 4. Verify compiler
      # ============================================================

      - name: Verify ARM64 compiler
        run: |
          echo "======================================"
          echo "GCC"
          echo "======================================"

          aarch64-linux-gnu-gcc --version

          echo "======================================"
          echo "G++"
          echo "======================================"

          aarch64-linux-gnu-g++ --version

          echo "======================================"
          echo "TARGET"
          echo "======================================"

          aarch64-linux-gnu-gcc -dumpmachine

          test \
            "$(aarch64-linux-gnu-gcc -dumpmachine)" \
            = "aarch64-linux-gnu"


      # ============================================================
      # 5. Inspect build system
      # ============================================================

      - name: Inspect old imgui-java build
        working-directory: imgui-java
        run: |
          echo "======================================"
          echo "FILES"
          echo "======================================"

          find . -maxdepth 3 -type f \
            \( \
              -name "build.gradle" \
              -o -name "*.gradle" \
              -o -name "*.xml" \
              -o -name "*.sh" \
              -o -name "gradlew" \
            \) \
            | sort

          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          ./gradlew --version


      # ============================================================
      # 6. Force ARM64 environment
      # ============================================================

      - name: Configure ARM64 environment
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          CC=aarch64-linux-gnu-gcc
          CXX=aarch64-linux-gnu-g++
          AR=aarch64-linux-gnu-ar
          AS=aarch64-linux-gnu-as
          LD=aarch64-linux-gnu-ld
          RANLIB=aarch64-linux-gnu-ranlib
          STRIP=aarch64-linux-gnu-strip
          TARGET=aarch64-linux-gnu
          EOF


      # ============================================================
      # 7. Build native JNI
      # ============================================================

      - name: Build native JNI
        working-directory: imgui-java
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          echo "======================================"
          echo "BUILD ENVIRONMENT"
          echo "======================================"

          env | grep -E \
            '^(CC|CXX|AR|AS|LD|RANLIB|STRIP|TARGET)=' \
            | sort

          echo "======================================"
          echo "BUILD"
          echo "======================================"

          ./gradlew \
            :imgui-binding:generateLibs \
            -Denvs=linux \
            -Dlocal \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log


      # ============================================================
      # 8. ALWAYS print log if build failed
      # ============================================================

      - name: Print build log
        if: always()
        run: |
          echo "======================================"
          echo "GRADLE LOG"
          echo "======================================"

          if [ -f gradle-build.log ]; then
            cat gradle-build.log
          else
            echo "No gradle-build.log found."
          fi


      # ============================================================
      # 9. Find native libraries
      # ============================================================

      - name: Find generated SO files
        if: always()
        working-directory: imgui-java
        run: |
          echo "======================================"
          echo "ALL SO FILES"
          echo "======================================"

          find . \
            -type f \
            -name "*.so" \
            -print \
            | sort


      # ============================================================
      # 10. Find expected library
      # ============================================================

      - name: Locate libimgui-java64.so
        id: findlib
        if: success()
        working-directory: imgui-java
        shell: bash
        run: |
          LIB=$(find . \
            -type f \
            -name "libimgui-java64.so" \
            -print -quit)

          if [ -z "$LIB" ]; then
            echo "::error::libimgui-java64.so was not generated."
            exit 1
          fi

          echo "LIB=$LIB" >> "$GITHUB_OUTPUT"

          echo "Found:"
          echo "$LIB"


      # ============================================================
      # 11. Check architecture
      # ============================================================

      - name: Verify ARM64 ELF
        if: success()
        working-directory: imgui-java
        run: |
          LIB="${{ steps.findlib.outputs.LIB }}"

          echo "======================================"
          echo "FILE"
          echo "======================================"

          file "$LIB"

          echo "======================================"
          echo "ELF HEADER"
          echo "======================================"

          readelf -h "$LIB"


      # ============================================================
      # 12. HARD ARM64 validation
      # ============================================================

      - name: Reject non ARM64
        if: success()
        working-directory: imgui-java
        shell: bash
        run: |
          LIB="${{ steps.findlib.outputs.LIB }}"

          MACHINE=$(readelf -h "$LIB" \
            | awk -F: '/Machine:/ {print $2}' \
            | xargs)

          echo "Machine: $MACHINE"

          if [[ "$MACHINE" != "AArch64" ]]; then
            echo "::error::Wrong architecture!"
            echo "::error::Expected AArch64"
            echo "::error::Got $MACHINE"
            exit 1
          fi

          echo "======================================"
          echo "SUCCESS"
          echo "======================================"
          echo "ARM64/AArch64 native library confirmed."


      # ============================================================
      # 13. Prepare artifact
      # ============================================================

      - name: Prepare artifact
        if: success()
        working-directory: imgui-java
        run: |
          mkdir -p ../artifact

          LIB="${{ steps.findlib.outputs.LIB }}"

          cp "$LIB" \
            ../artifact/libimgui-java64.so

          git rev-parse HEAD \
            > ../artifact/SOURCE_COMMIT.txt

          file "$LIB" \
            > ../artifact/FILE_INFO.txt

          readelf -h "$LIB" \
            > ../artifact/ELF_HEADER.txt

          echo "======================================"
          echo "ARTIFACT"
          echo "======================================"

          ls -lh ../artifact


      # ============================================================
      # 14. Upload
      # ============================================================

      - name: Upload ARM64 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-linux-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
